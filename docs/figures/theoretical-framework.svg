<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550">
  <defs>
    <style>
      .diagram-heading {
        font-family: 'Times New Roman', Times, serif;
        font-size: 16px;
        font-weight: bold;
        fill: #000000;
      }
      .box-text {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 11.5px;
        font-weight: normal;
        fill: #000000;
        text-anchor: middle;
      }
      .system-box-text {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 12px;
        font-weight: normal;
        fill: #000000;
        text-anchor: middle;
      }
      .caption-bold {
        font-family: 'Times New Roman', Times, serif;
        font-size: 12.5px;
        font-weight: bold;
        fill: #000000;
      }
      .caption-italic {
        font-family: 'Times New Roman', Times, serif;
        font-size: 12.5px;
        font-style: italic;
        fill: #000000;
      }
    </style>
    <marker id="arrow" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="5" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#000000" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="550" fill="#ffffff" />

  <!-- Heading Above Diagram (Top-Left) -->
  <text x="40" y="45" class="diagram-heading">Theoretical Framework</text>

  <!-- ======================================================== -->
  <!-- 1. TOP ROW: THREE THEORY BOXES                           -->
  <!-- ======================================================== -->
  <!-- Theory 1 (Left): Continuity of Care -->
  <g id="theory-continuity-of-care">
    <rect x="40" y="75" width="240" height="52" rx="6" ry="6" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
    <text x="160" y="96" class="box-text">Continuity of Care</text>
    <text x="160" y="113" class="box-text">Haggerty et al. (2003)</text>
  </g>

  <!-- Theory 2 (Center): Role-Based Access Control -->
  <g id="theory-rbac">
    <rect x="330" y="75" width="240" height="52" rx="6" ry="6" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
    <text x="450" y="96" class="box-text">Role-Based Access Control</text>
    <text x="450" y="113" class="box-text">Sandhu et al. (1996)</text>
  </g>

  <!-- Theory 3 (Right): Technology Acceptance Model -->
  <g id="theory-tam">
    <rect x="620" y="75" width="240" height="52" rx="6" ry="6" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
    <text x="740" y="96" class="box-text">Technology Acceptance Model</text>
    <text x="740" y="113" class="box-text">Davis (1989)</text>
  </g>

  <!-- ======================================================== -->
  <!-- 2. CONNECTORS TO SYSTEM BOX (Right-Angle Routing)         -->
  <!-- ======================================================== -->
  <!-- Left Box Arrow: Drops down, turns right inward, drops down onto system box -->
  <path d="M 160,127 L 160,166 L 300,166 L 300,205" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- Center Box Arrow: Drops straight down onto system box -->
  <line x1="450" y1="127" x2="450" y2="205" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- Right Box Arrow: Drops down, turns left inward, drops down onto system box -->
  <path d="M 740,127 L 740,166 L 600,166 L 600,205" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- ======================================================== -->
  <!-- 3. SYSTEM BOX (Center, wider than theory boxes)          -->
  <!-- ======================================================== -->
  <g id="system-box">
    <rect x="170" y="205" width="560" height="50" rx="6" ry="6" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
    <text x="450" y="235" class="system-box-text">CareConnect: Web-Based Caregiver Reporting and Patient Monitoring System</text>
  </g>

  <!-- ======================================================== -->
  <!-- 4. STRAIGHT ARROW DOWN TO EVALUATION MODELS BOX          -->
  <!-- ======================================================== -->
  <line x1="450" y1="255" x2="450" y2="300" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- ======================================================== -->
  <!-- 5. EVALUATION MODELS BOX (Center, smaller than system)   -->
  <!-- ======================================================== -->
  <g id="evaluation-models-box">
    <rect x="350" y="300" width="200" height="45" rx="6" ry="6" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
    <text x="450" y="327" class="box-text">Evaluation models</text>
  </g>

  <!-- ======================================================== -->
  <!-- 6. FORK CONNECTOR TO BOTTOM ROW                          -->
  <!-- ======================================================== -->
  <!-- Short vertical line down from box, horizontal span, dropping arrows at each end -->
  <path d="M 450,345 L 450,380 M 175,380 L 725,380 M 175,380 L 175,415 M 725,380 L 725,415" fill="none" stroke="#000000" stroke-width="1.2" />
  <!-- Arrowhead at Left Drop -->
  <line x1="175" y1="405" x2="175" y2="415" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
  <!-- Arrowhead at Right Drop -->
  <line x1="725" y1="405" x2="725" y2="415" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- ======================================================== -->
  <!-- 7. BOTTOM ROW: TWO BOXES AT FAR LEFT AND FAR RIGHT       -->
  <!-- ======================================================== -->
  <!-- Left Box: Software quality evaluation -->
  <g id="evaluation-software-quality">
    <rect x="50" y="415" width="250" height="52" rx="6" ry="6" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
    <text x="175" y="436" class="box-text">Software quality evaluation</text>
    <text x="175" y="453" class="box-text">ISO/IEC 25010</text>
  </g>

  <!-- Right Box: User acceptance evaluation -->
  <g id="evaluation-user-acceptance">
    <rect x="600" y="415" width="250" height="52" rx="6" ry="6" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
    <text x="725" y="436" class="box-text">User acceptance evaluation</text>
    <text x="725" y="453" class="box-text">TAM, Davis (1989)</text>
  </g>

  <!-- ======================================================== -->
  <!-- CAPTION                                                  -->
  <!-- ======================================================== -->
  <text x="450" y="515" text-anchor="middle">
    <tspan class="caption-bold">Figure 1.1: </tspan>
    <tspan class="caption-italic">Theoretical Framework of the Study</tspan>
  </text>
</svg>
